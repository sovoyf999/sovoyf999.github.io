# ===============================================================
# NexT 主题个性化配置（Alternate Theme Config，推荐方式）
# 只写需要覆盖主题默认值的项，其余自动继承 themes/next/_config.yml
# 文档: https://theme-next.js.org/docs/getting-started/configuration
# ===============================================================

# ---------------------------------------------------------------
# 外观方案: Muse | Mist | Pisces | Gemini
# ---------------------------------------------------------------
scheme: Gemini

# 暗色模式: true | false | auto
darkmode: true

# ---------------------------------------------------------------
# 导航菜单（Key: /链接/ || 图标）
# ---------------------------------------------------------------
menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  archives: /archives/ || fa fa-archive
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-layer-group

menu_settings:
  icons: true
  badges: false

# ---------------------------------------------------------------
# 社交链接
# ---------------------------------------------------------------
social:
  GitHub: https://github.com/sovoyf999 || fab fa-github
  E-Mail: mailto:suyufeng4399@outlook.com || fa fa-envelope

social_icons:
  enable: true
  icons_only: false
  transition: false

# ---------------------------------------------------------------
# 侧栏头像（使用 GitHub 头像，已下载到 source/images/avatar.png）
# ---------------------------------------------------------------
avatar:
  url: /images/avatar.png
  rounded: true
  rotated: true

# 侧栏显示文章/分类/标签统计
site_state: true

# ---------------------------------------------------------------
# 阅读进度条
# ---------------------------------------------------------------
reading_progress:
  enable: true
  color: "#6366f1"
  height: 3px

# ---------------------------------------------------------------
# 书签（记住阅读位置）
# ---------------------------------------------------------------
bookmark:
  enable: true
  color: "#6366f1"
  save: auto

# ---------------------------------------------------------------
# 返回顶部
# ---------------------------------------------------------------
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# ---------------------------------------------------------------
# 代码块：主题 + 一键复制
# ---------------------------------------------------------------
codeblock:
  copy_button:
    enable: true
    show_result: true
  theme:
    light: default
    dark: stackoverflow-dark

# ---------------------------------------------------------------
# 动效
# ---------------------------------------------------------------
motion:
  enable: true
  async: false
  transition:
    menu_item: fadeInDown
    post_block: fadeIn
    post_header: fadeInDown
    post_body: fadeInDown
    coll_header: fadeInLeft
    sidebar: fadeInUp

# ---------------------------------------------------------------
# 本地搜索
# ---------------------------------------------------------------
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1
  unescape: false
  preload: false

# ---------------------------------------------------------------
# 文章目录（TOC）
# ---------------------------------------------------------------
toc:
  enable: true
  number: true
  expand_all: false
  max_depth: 6

# ---------------------------------------------------------------
# 文章元信息：创建/更新时间、分类
# ---------------------------------------------------------------
post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true

# ---------------------------------------------------------------
# 页脚
# ---------------------------------------------------------------
footer:
  since: 2026
  copyright: sovoyf999
  powered: true
  theme:
    enable: true
  icon:
    name: fa fa-heart
    animated: true
    color: "#ff0000"

# ---------------------------------------------------------------
# 自定义头部（注入 /css/custom.css）
# ---------------------------------------------------------------
custom_file_path:
  head: source/_data/head.njk
