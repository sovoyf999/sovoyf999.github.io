# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: sovoyf999的小窝
subtitle: 记录技术与生活
description: 一个基于 Hexo + GitHub Pages 的个人博客
keywords: "Hexo, GitHub Pages, 博客"
author: sovoyf999
language: zh-CN
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'https://example.com/blog' and root as '/blog/'
## GitHub Pages user site: https://yourname.github.io (no trailing slash)
## GitHub Pages project site: https://yourname.github.io/reponame
url: https://sovoyf999.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page (0 = disable pagination)
# order_by: Posts order (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display dates
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
## Install plugin first: npm install hexo-deployer-git
##
## 用户站点（yourname.github.io）推荐做法：源码放 main 分支，产物放 gh-pages 分支，
## 然后在 GitHub 仓库 Settings -> Pages -> Build and deployment -> Source
## 选择 "Deploy from a branch"，分支选 gh-pages，目录 /(root)。
## 这样源码永远不会被部署覆盖。
##
## 如果想更简单（不保留源码在远端），可改为 branch: main，
## 但注意：部署会把 public 内容强制推送进 main，覆盖该分支上的源码！
##
## 项目站点（仓库名任意）：branch 用 gh-pages，访问地址为
## https://yourname.github.io/<仓库名>，并相应修改上方 url 与 root。
deploy:
  type: git
  repo: https://github.com/sovoyf999/sovoyf999.github.io.git
  branch: gh-pages
  message: "Site updated: {{ now('yyyy-MM-dd HH:mm:ss') }}"

# ---------------------------------------------------------------
# 本地搜索索引（配合 NexT local_search）
# ---------------------------------------------------------------
search:
  path: search.xml
  field: post
  format: html
  limit: 10000
